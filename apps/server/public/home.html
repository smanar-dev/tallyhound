<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tallyhound</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="wide">
  <div class="row"><p class="brand"><i></i><span id="firm">Tallyhound</span></p><p class="small muted"><span id="me"></span> &middot; <button class="btn link" id="out" type="button">Sign out</button></p></div>
  <div id="msg" class="note bad" role="alert" hidden></div>
  <div id="state" class="note info" hidden></div>
  <section class="card">
    <h1>You are signed in</h1>
    <p class="muted">The Tallyhound screens are being built. Until they are here, this page shows that your firm's workspace is live.</p>
    <table><tbody id="facts"></tbody></table>
  </section>
  <section class="card">
    <div class="row"><h2>People at your firm</h2></div>
    <table><thead><tr><th>Name</th><th>Email</th><th>Can do</th><th>Two-step sign-in</th></tr></thead><tbody id="people"></tbody></table>
    <form id="f-add" hidden>
      <h2 id="add-h">Add a person</h2>
      <div class="row">
        <span><label for="p-name">Name</label><input id="p-name" type="text" required></span>
        <span><label for="p-email">Work email</label><input id="p-email" type="email" required></span>
        <span><label for="p-role">Can do</label><select id="p-role"><option value="staff">Everything except settings</option><option value="read_only">Look only</option><option value="owner">Everything (owner)</option></select></span>
        <button class="btn pri" type="submit">Add</button>
      </div>
    </form>
    <p id="solo" class="small muted" hidden>You are the only owner. Add a second owner so the firm is never locked out.</p>
  </section>
</main>
<script src="/home.js"></script>
</body>
</html>
